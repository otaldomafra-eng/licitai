name: Conversation Regression

on:
  push:
    paths:
      - 'src/lib/whatsapp/**'
      - 'src/app/api/whatsapp/webhook/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/conversation-regression.yml'
  pull_request:
    paths:
      - 'src/lib/whatsapp/**'
      - 'src/app/api/whatsapp/webhook/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/conversation-regression.yml'

jobs:
  conversation-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm run test:conversation:regression

      - name: Run lint
        run: npm run lint
